[project]
name = "cognitive-mirror-backend"
version = "0.1.0"
description = "AI-powered Capability Intelligence Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # --- Data Validation & Config ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",

    # --- Auth ---
    "firebase-admin>=6.5",
    "pyjwt>=2.8",

    # --- AI / LLM ---
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",

    # --- Retrieval (ARC, vendored at Backend/hybrid_rag) ---
    "scikit-learn>=1.4",

    # --- Database ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",   # development default
    "asyncpg>=0.29",     # production (PostgreSQL)
    "greenlet>=3.0",     # required by SQLAlchemy async

    # --- HTTP ---
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
eval = [
    "deepeval>=1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
